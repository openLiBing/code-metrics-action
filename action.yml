name: "openlibing-code-metrics-action"
author: "openLiBing"
version: 1.0.4
description: "代码度量扫描插件 - 检测代码规模、平均函数代码行数、平均圈复杂度、代码重复率和文件重复率"
inputs:
  exclude-dirs:
    description: "排除目录列表，逗号分隔"
    required: false
    default: ""
  allowed-extensions:
    description: "允许的文件扩展名，逗号分隔"
    required: false
    default: ""
  output:
    description: "结果输出文件路径"
    required: false
    default: "metrics.json"
  upload:
    description: "是否上传检测结果到 openLiBing"
    required: false
    default: "true"
runs:
  using: "node16"
  main: "dist/index.js"
