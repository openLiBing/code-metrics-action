name: "openlibing-code-metrics-action"
author: "openLiBing"
version: 1.0.5
description: "代码度量扫描插件 - 检测代码规模、平均函数代码行数、平均圈复杂度、代码重复率和文件重复率"
inputs:
  exclude-dirs:
    description: "排除目录/文件列表，逗号分隔，支持通配符 *、**、?、[abc]；裸名称仅匹配顶层，含 / 路径锚定扫描根"
    required: false
    default: ""
    layout:
      type: "input"
      label: "排除目录列表"
      extend_prop:
        visible_conditions: []
        disabled_conditions: []
      validation:
        required_message: ""
  allowed-extensions:
    description: "允许的文件扩展名，逗号分隔"
    required: false
    default: ""
    layout:
      type: "input"
      label: "允许的文件扩展名"
      extend_prop:
        visible_conditions: []
        disabled_conditions: []
      validation:
        required_message: ""
  output:
    description: "结果输出文件路径"
    required: false
    default: "metrics.json"
    layout:
      type: "input"
      label: "结果输出文件路径"
      extend_prop:
        visible_conditions: []
        disabled_conditions: []
      validation:
        required_message: ""
  apig-app-key:
    description: "APIG 网关 AppKey（AK），仅 AK/SK 模式使用。workflow 已声明 permissions: id-token: write 时走 OIDC 免密联邦认证，无需传入"
    required: false
    default: ""
    layout:
      type: "input"
      label: "APIG AppKey（AK/SK 模式）"
      extend_prop:
        visible_conditions: []
        disabled_conditions: []
      validation:
        required_message: ""
  apig-app-secret:
    description: "APIG 网关 AppSecret（SK），与 apig-app-key 配套，仅 AK/SK 模式使用"
    required: false
    default: ""
    layout:
      type: "input"
      label: "APIG AppSecret（AK/SK 模式）"
      extend_prop:
        visible_conditions: []
        disabled_conditions: []
      validation:
        required_message: ""
  obs-ak:
    description: "OBS 访问密钥 AK，仅 AK/SK 模式使用（全量上报文件上传到 openlibing-gitcode-action 桶）。OIDC 模式使用 STS 临时凭证，无需传入"
    required: false
    default: ""
    layout:
      type: "input"
      label: "OBS AK（AK/SK 模式）"
      extend_prop:
        visible_conditions: []
        disabled_conditions: []
      validation:
        required_message: ""
  obs-sk:
    description: "OBS 访问密钥 SK，与 obs-ak 配套，仅 AK/SK 模式使用"
    required: false
    default: ""
    layout:
      type: "input"
      label: "OBS SK（AK/SK 模式）"
      extend_prop:
        visible_conditions: []
        disabled_conditions: []
      validation:
        required_message: ""
runs:
  using: "node16"
  main: "dist/index.js"
