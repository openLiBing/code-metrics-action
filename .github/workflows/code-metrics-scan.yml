name: code-metrics-scan

on:
  # 手动触发：仓库 Actions 页面点击 Run workflow
  workflow_dispatch:
  # 代码推送触发：合并到主分支后自动扫描
  push:
    branches:
      - master

# OIDC 免密认证：必须声明 id-token: write，插件据此向平台申请 ID Token 换取华为云临时凭证
permissions:
  contents: read
  id-token: write

# 并发控制（可选，非必须）：同一分支只保留最新一次扫描。
# 新任务启动时取消同组中仍在运行的旧任务，避免重复占用执行机，
# 也避免旧提交的扫描晚于新提交完成导致平台展示结果错乱。
concurrency:
  group: code-metrics-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-metrics-scan:
    name: 代码度量检测
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 使用本仓库内的插件（迁移验证），OIDC 模式调用 APIG 接口，无需配置任何密钥
      - name: Code metrics scan
        uses: ./
        with:
          # 排除非业务代码目录，避免把依赖与构建产物计入指标
          exclude-dirs: ".git,.github,node_modules,dist,tmp_pre-commit-reports"
