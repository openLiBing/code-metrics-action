name: build

on:
  workflow_dispatch:
  push: # master 分支推送触发构建
    branches:
      - master
  pull_request: # PR 触发构建验证
    branches:
      - "*"
  pull_request_comment: # PR 评论 /build 触发构建验证
    types: [created]
    comments: ["/build"]
    branches:
      - "*"

permissions:
  repository: read # checkout 插件最低权限要求

jobs:
  build:
    name: build
    runs-on: ["self-hosted", "region=cn"]
    steps:
      - name: checkout
        uses: checkout
        with:
          ref: ${{ atomgit.event.pull_request.merge_commit_sha || '' }} # PR 场景检出预合并 commit（验证合入默认分支后的最终状态），push/手动场景为空走默认检出

      # setup-node 官方插件存在 tool cache 目录权限缺陷（/opt/tools/cache 无写权限时安装失败 EACCES），插件修复前在此临时规避
      - name: bootstrap tool cache dir
        run: |
          if [ ! -d /opt/tools/cache ] || [ ! -w /opt/tools/cache ]; then
            sudo mkdir -p /opt/tools/cache
            sudo chown -R "$(id -u):$(id -g)" /opt/tools
          fi

      - name: setup-node
        uses: setup-node
        with:
          node-version: 20
          cache: true

      # npm ci 按 lockfile 精确安装依赖；随后依次执行格式检查、静态检查与完整构建链（ncc 打包 + 复制二进制）
      - name: install dependencies
        run: npm ci

      - name: format check
        run: npm run format:check

      - name: lint
        run: npm run lint

      - name: build
        run: npm run build

      # dist 与源码一致性门禁：src 改动后忘记重建并提交 dist 时直接失败，避免发布旧逻辑
      # 忽略行尾空白差异：构建产物在不同平台/钩子下可能有纯空白差异，只拦截实质内容漂移与新增文件
      - name: check dist in sync
        run: |
          if ! git diff --ignore-space-at-eol --exit-code -- dist || [ -n "$(git ls-files --others --exclude-standard -- dist)" ]; then
            echo "dist 与源码不一致，请本地执行 npm run build 并提交 dist 变更：" >&2
            git diff --stat -- dist
            git ls-files --others --exclude-standard -- dist
            exit 1
          fi
