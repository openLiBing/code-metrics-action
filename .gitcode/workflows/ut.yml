name: ut

on:
  workflow_dispatch:
  push: # master 分支推送触发 UT
    branches:
      - master
  pull_request: # PR 触发 UT
    branches:
      - "*"
  pull_request_comment: # PR 评论 /ut 触发 UT
    types: [created]
    comments: ["/ut"]
    branches:
      - "*"

permissions:
  repository: read # checkout 插件最低权限要求
  id-token: write # upload-ut-action OIDC 上传需要

env:
  # UT增量行覆盖率门禁阈值：低于该值 PR 流水线失败，可通过仓库变量覆盖，未配置默认 80
  UT_INCREMENTAL_LINE_COVERAGE_THRESHOLD: ${{ vars.UT_INCREMENTAL_LINE_COVERAGE_THRESHOLD || '80' }}
  # UT报告输出目录：c8 默认输出路径；json 供平台上报，cobertura 供 diff-cover 计算增量覆盖率
  UT_REPORT_DIR: coverage/
  # PR 触发场景标记：覆盖率上报仅 push/手动触发执行
  IS_PR_EVENT: ${{ atomgit.event_name != '' && contains('pull_request_target,pull_request_comment,MR,Note', atomgit.event_name) }}

jobs:
  ut:
    name: ut
    runs-on: ["self-hosted", "region=cn", "flavor=large"]
    steps:
      - name: checkout
        uses: checkout
        with:
          ref: ${{ atomgit.event.pull_request.merge_commit_sha || atomgit.event.pull_request.head.sha }} # PR 场景检出预合并 commit（验证合入默认分支后的最终状态），缺失时回退 PR head，push/手动场景为空走默认检出
          fetch-depth: 0 # 全量检出以生成基线分支远端 ref，供增量覆盖率比较

      # setup 插件在当前执行机上对 /opt/tools 无写权限时会安装失败，此处临时规避
      - name: bootstrap tool cache dir
        run: |
          if [ ! -d /opt/tools/cache ] || [ ! -w /opt/tools/cache ]; then
            sudo mkdir -p /opt/tools/cache
            sudo chown -R "$(id -u):$(id -g)" /opt/tools
          fi

      - name: setup-node
        uses: setup-node
        with:
          node-version: 20
          cache: true

      - name: install dependencies
        run: npm install --no-audit --no-fund

      - name: setup-python (diff-cover)
        uses: setup-python
        with:
          version: 3.14.3

      # node 内置测试运行器（node --test）经 c8 采集 V8 覆盖率：json 供平台上报，cobertura 供 diff-cover 计算变更行覆盖率
      # c8 统计口径由 .c8rc.json 统一配置（--all --src=src：未加载文件按 0% 纳入报告；action 入口 index.js 不计入）
      - name: ut
        run: npx --yes c8@^10 node --test

      # 将ut报告上传至openlibing平台运营
      - name: upload ut report to openlibing
        if: ${{ env.IS_PR_EVENT != 'true' }} # 默认仅前置步骤全部成功时执行（success 为平台默认行为），测试失败不上报残缺报告
        uses: openlibing/upload-ut-action@v1.0.0
        with:
          report_dir: ${{ env.UT_REPORT_DIR }}coverage-final.json

      # PR场景做增量覆盖率门禁：仅当变更行覆盖率低于阈值时判红；基线/报告缺失属门禁执行失败，单独提示，避免误报“请补单测”
      - name: diff coverage check
        if: ${{ env.IS_PR_EVENT == 'true' }}
        run: |
          pip install "diff-cover>=9.6,<11"
          BASE_REF="${ATOMGIT_BASE_REF:-}"
          if [ -z "$BASE_REF" ]; then
            echo "[UT 增量行覆盖率门禁] 未取到基线分支（ATOMGIT_BASE_REF 为空，评论触发不携带 PR 基线），跳过增量门禁"
            exit 0
          fi
          if ! git rev-parse --verify --quiet "origin/${BASE_REF}" >/dev/null; then
            echo "[UT 增量行覆盖率门禁] 基线 ref origin/${BASE_REF} 不存在，门禁执行失败（请确认 checkout 使用 fetch-depth: 0）" >&2
            exit 1
          fi
          if [ ! -f "${UT_REPORT_DIR}cobertura-coverage.xml" ]; then
            echo "[UT 增量行覆盖率门禁] 覆盖率报告 ${UT_REPORT_DIR}cobertura-coverage.xml 不存在，门禁执行失败（单元测试可能未产出报告）" >&2
            exit 1
          fi
          rc=0
          diff-cover "${UT_REPORT_DIR}cobertura-coverage.xml" --compare-branch "origin/${BASE_REF}" --fail-under "${UT_INCREMENTAL_LINE_COVERAGE_THRESHOLD}" --html-report "${UT_REPORT_DIR}diff-coverage.html" || rc=$?
          if [ "$rc" -eq 1 ]; then
            echo "[UT 增量行覆盖率门禁] 未达标：目标 >= ${UT_INCREMENTAL_LINE_COVERAGE_THRESHOLD}%，实际值见上方 Coverage，请为本次变更代码补充单元测试后重新触发"
            exit 1
          elif [ "$rc" -ne 0 ]; then
            echo "[UT 增量行覆盖率门禁] 门禁执行失败（diff-cover 退出码 ${rc}），请查看上方日志" >&2
            exit "${rc}"
          fi

      # PR场景上传完整覆盖率报告（diff-coverage.html 增量明细 + c8 全量报告），打包为 zip 供下载；1 天后自动清理避免配额累积
      - name: upload diff coverage report
        if: ${{ always() && env.IS_PR_EVENT == 'true' }} # 门禁失败场景也需可下载报告
        uses: upload-artifact
        with:
          name: coverage-report
          path: ${{ env.UT_REPORT_DIR }}
          overwrite: true
          if-no-files-found: warn
          retention-days: 1
