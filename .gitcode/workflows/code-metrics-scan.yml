name: code-metrics-scan-nightly

on:
  workflow_dispatch:
  push:
    branches:
      - master
  schedule:
    - cron: "0 0 0 * * ?"

permissions:
  repository: read
  id-token: write

jobs:
  code-metrics-scan:
    name: 代码度量指标扫描
    runs-on: ["codearts-hosted", "ubuntu-latest", "x64", "slim"]
    steps:
      - name: Checkout
        uses: checkout

      - name: code-metrics-scan
        uses: openlibing/code-metrics-action@6723b5fca2a631a680386c860cb3dbc67e502849
