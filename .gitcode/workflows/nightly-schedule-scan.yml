name: nightly-schedule-scan

on:
  schedule:
    - cron: "0 0 3 * * ?"
  workflow_dispatch:

permissions:
  repository: read
  id-token: write

stages:
  nightly-scan:
    name: 夜间扫描
    fail_fast: false
    jobs:
      pre-commit:
        name: pre-commit
        runs-on: ["self-hosted", "default"]
        steps:
          - name: Checkout repository
            uses: checkout
            with:
              ref: master

          - name: Install npm dependencies
            run: npm install

          - name: setup-prettier
            run: npm install --save-dev --save-exact prettier@3.9.5

          - name: Prepare SARIF report directory
            run: mkdir -p ./tmp_pre-commit-reports

          - name: run pre-commit
            id: pre-commit
            uses: openlibing/pre-commit-action@v1.1.0
            with:
              extra_args: "--config=.pre-commit-nightly-config.yaml --all-files"
              report-dir: ./tmp_pre-commit-reports/

          - name: upload sarif reports
            if: ${{ always() }}
            uses: openlibing/upload-sarif-action@v1.0.2
            with:
              sarif_file: ${{ steps.pre-commit.outputs.sarif-files }}
              source_path: .
